name: Build, Test & Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Prepare desktop for UI tests
        shell: powershell
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: Validate release tag and notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = [regex]::Match((Get-Content CMakeLists.txt -Raw), 'project\(GoPieMenu VERSION ([0-9.]+)').Groups[1].Value
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Release tag does not match the application version." }
          ./scripts/release-notes.ps1 -Version $env:GITHUB_REF_NAME -OutputPath build/release-notes.md
          ./scripts/release-platforms.ps1 -Version $env:GITHUB_REF_NAME | Out-Null
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.0'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
      - name: Build and test core and QML at four DPI scales
        shell: pwsh
        run: ./scripts/build.ps1 -QtRoot $env:Qt6_DIR
      - name: Upload test results and UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-regression-results
          path: |
            build/test-results.xml
            build/Testing/Temporary/LastTest.log
            build/artifacts/*.png
            build/artifacts/*.txt
      - name: Package installer and verify deployed startup
        shell: pwsh
        run: ./scripts/package.ps1 -QtRoot $env:Qt6_DIR
      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: |
            Output/GoPieMenu_Setup.exe
            Output/SHA256SUMS.txt

  macos:
    name: macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(sed -n 's/^project(GoPieMenu VERSION \([0-9][0-9.]*\).*/\1/p' CMakeLists.txt)
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Release tag does not match the application version." >&2
            exit 1
          fi
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.0'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          cache: true
      - name: Build universal app and run tests
        shell: bash
        env:
          # The official Qt 6.9 macOS binaries are universal, so one build serves both Macs.
          GPM_OSX_ARCHITECTURES: 'arm64;x86_64'
        run: bash scripts/build-macos.sh
      - name: Upload test results and UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-regression-results
          path: |
            build/test-results.xml
            build/test-results-ui.xml
            build/Testing/Temporary/LastTest.log
            build/artifacts/*.png
            build/artifacts/*.txt
      - name: Package DMG and verify SDK-independent startup
        if: github.event_name != 'pull_request'
        shell: bash
        run: bash scripts/package-macos.sh
      - name: Upload macOS package for the release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: |
            Output/GoPieMenu-*.dmg
            Output/SHA256SUMS.macos.txt

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release platforms
        id: platforms
        shell: pwsh
        run: |
          $summary = ./scripts/release-platforms.ps1 -Version $env:GITHUB_REF_NAME -OutputPath release-platforms.json
          $data = Get-Content release-platforms.json -Raw | ConvertFrom-Json
          "version=$($data.version)" >> $env:GITHUB_OUTPUT
          "platforms=$($data.platforms -join ',')" >> $env:GITHUB_OUTPUT
          "make_latest=$($data.latest.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Output $summary
      - uses: actions/download-artifact@v4
        with:
          name: windows-package
          path: package/windows
      - uses: actions/download-artifact@v4
        with:
          name: macos-package
          path: package/macos
      - name: Assemble release assets for the declared platforms
        shell: bash
        env:
          PLATFORMS: ${{ steps.platforms.outputs.platforms }}
        run: |
          set -euo pipefail
          mkdir -p package/upload
          : > package/upload/SHA256SUMS.txt
          IFS=',' read -ra selected <<< "$PLATFORMS"
          for platform in "${selected[@]}"; do
            case "$platform" in
              windows)
                cp package/windows/GoPieMenu_Setup.exe package/upload/
                cat package/windows/SHA256SUMS.txt >> package/upload/SHA256SUMS.txt
                ;;
              macos)
                cp package/macos/GoPieMenu-*.dmg package/upload/
                cat package/macos/SHA256SUMS.macos.txt >> package/upload/SHA256SUMS.txt
                ;;
              *)
                echo "Unknown platform: $platform" >&2
                exit 1
                ;;
            esac
          done
          cat package/upload/SHA256SUMS.txt
      - name: Extract multilingual release notes
        shell: pwsh
        run: ./scripts/release-notes.ps1 -Version $env:GITHUB_REF_NAME -OutputPath release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: GoPieMenu ${{ github.ref_name }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          make_latest: ${{ steps.platforms.outputs.make_latest }}
          files: package/upload/*
      - name: Enforce the latest policy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MAKE_LATEST: ${{ steps.platforms.outputs.make_latest }}
        run: |
          # The action has had regressions around make_latest; set it explicitly.
          # The API only updates a release by numeric id, not by tag path.
          release_id=$(gh api "repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" --jq .id)
          gh api --method PATCH "repos/${{ github.repository }}/releases/$release_id" \
            -f make_latest="$MAKE_LATEST"
      - name: Update the per-platform update channel
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORMS: ${{ steps.platforms.outputs.platforms }}
          VERSION: ${{ steps.platforms.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $contentPath = "repos/$env:REPOSITORY/contents/platform-versions.json"
          $sha = gh api "${contentPath}?ref=release-channel" --jq '.sha'
          $encoded = gh api "${contentPath}?ref=release-channel" --jq '.content'
          $text = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(($encoded -replace '\s', '')))
          $versions = $text | ConvertFrom-Json
          foreach ($platform in $env:PLATFORMS.Split(',')) {
            $versions | Add-Member -NotePropertyName $platform -NotePropertyValue $env:VERSION -Force
          }
          $updated = ($versions | ConvertTo-Json -Compress) + "`n"
          $body = @{
            message = "chore: publish $env:VERSION for $env:PLATFORMS [skip ci]"
            content = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($updated))
            branch = 'release-channel'
            sha = $sha
          } | ConvertTo-Json
          $body | Out-File -Encoding utf8 channel.json
          gh api --method PUT $contentPath --input channel.json | Out-Null
          $check = gh api "${contentPath}?ref=release-channel" --jq '.content'
          $checkText = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(($check -replace '\s', '')))
          Write-Output $checkText
          if ($checkText -ne $updated) { throw 'The per-platform update channel was not stored as expected.' }
