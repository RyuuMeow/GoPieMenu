name: Windows Build, Test & Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Validate release tag and notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = [regex]::Match((Get-Content CMakeLists.txt -Raw), 'project\(GoPieMenu VERSION ([0-9.]+)').Groups[1].Value
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Release tag does not match the application version." }
          if (!(Test-Path -LiteralPath "docs/releases/$env:GITHUB_REF_NAME.md")) { throw "Release notes are missing." }
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: jurplel/install-qt-action@v3
        with:
          version: '6.9.0'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
      - name: Build and test core and QML at four DPI scales
        shell: pwsh
        run: ./scripts/build.ps1 -QtRoot $env:Qt6_DIR
      - name: Upload test results and UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-results
          path: |
            build/test-results.xml
            build/Testing/Temporary/LastTest.log
            build/artifacts/*.png
            build/artifacts/*.txt
      - name: Package installer and verify deployed startup
        shell: pwsh
        run: ./scripts/package.ps1 -QtRoot $env:Qt6_DIR
      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: |
            Output/GoPieMenu_Setup.exe
            Output/SHA256SUMS.txt

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-package
          path: package
      - uses: softprops/action-gh-release@v2
        with:
          name: GoPieMenu ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          fail_on_unmatched_files: true
          files: |
            package/GoPieMenu_Setup.exe
            package/SHA256SUMS.txt
