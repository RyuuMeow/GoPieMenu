name: Windows Build, Test & Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: jurplel/install-qt-action@v3
        with:
          version: '6.9.0'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
      - name: Build and test core and QML at four DPI scales
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Upload test results and UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-results
          path: |
            build/test-results.xml
            build/Testing/Temporary/LastTest.log
            build/artifacts/*.png
            build/artifacts/*.txt
      - name: Deploy Qt and QML dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force deploy
          Copy-Item build/Release/GoPieMenu.exe deploy/
          Copy-Item LICENSE,THIRD_PARTY_LICENSES.md deploy/
          windeployqt --release --qmldir src/ui/qml --no-translations deploy/GoPieMenu.exe
          if ($LASTEXITCODE) { throw "Qt deployment failed." }
      - name: Verify the deployed application starts independently
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot/System32;$env:SystemRoot"
          $process = Start-Process -FilePath ./deploy/GoPieMenu.exe -ArgumentList --smoke-test -WindowStyle Hidden -PassThru
          if (!$process.WaitForExit(15000)) { $process.Kill(); throw "Startup smoke test timed out." }
          if ($process.ExitCode) { throw "Startup smoke test failed: $($process.ExitCode)" }
      - name: Compile installer
        shell: pwsh
        run: |
          & "C:/Program Files (x86)/Inno Setup 6/ISCC.exe" installer.iss
          if ($LASTEXITCODE) { throw "Installer compilation failed." }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: Output/GoPieMenu_Setup.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-package
          path: package
      - uses: softprops/action-gh-release@v2
        with:
          files: package/GoPieMenu_Setup.exe
